<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>竹小兒樂行事曆</title>
  <style>
    :root{
      --bg1:#fff7ed;--bg2:#eef8ff;--card:#ffffff;--text:#24303a;--muted:#718096;--line:#dfe7ef;
      --sun:#ff7b7b;--sat:#5b8def;--yellow:#ffd76a;--teal:#54c7b7;--orange:#ff9f68;
      --purple:#9d7bea;--pink:#f47eb3;--green:#6bcf8f;--blue:#62a9f4;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--text);background:radial-gradient(circle at 12% 8%,#fff0b8 0 90px,transparent 91px),radial-gradient(circle at 88% 12%,#d8efff 0 110px,transparent 111px),linear-gradient(135deg,var(--bg1),var(--bg2));}
    .wrap{max-width:1180px;margin:0 auto;padding:28px 16px 48px}
    .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:24px 26px;margin-bottom:18px;border-radius:26px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.75);box-shadow:0 14px 40px rgba(71,91,112,.10);backdrop-filter:blur(8px)}
    h1{margin:0;font-size:clamp(1.7rem,4vw,2.6rem);letter-spacing:.04em}.subtitle{margin-top:6px;color:var(--muted);font-size:.96rem}
    .dots{display:flex;gap:8px;align-items:center}.dot{width:13px;height:13px;border-radius:50%}.dot:nth-child(1){background:var(--orange)}.dot:nth-child(2){background:var(--teal)}.dot:nth-child(3){background:var(--purple)}.dot:nth-child(4){background:var(--pink)}
    .calendar-shell{background:rgba(255,255,255,.94);border-radius:28px;padding:20px;box-shadow:0 16px 46px rgba(72,91,111,.12);border:1px solid rgba(255,255,255,.85)}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
    .left-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.month-title{font-size:1.45rem;font-weight:900;letter-spacing:.03em}
    .nav,.view-toggle{display:flex;gap:8px}.nav button,.view-toggle button{border:0;cursor:pointer;font-weight:800}
    .nav button{background:#f3f7fb;color:#445160;width:38px;height:38px;border-radius:12px;font-size:1.1rem}.nav button:hover{background:#eaf1f7}
    .view-toggle{padding:4px;background:#f1f5f9;border-radius:14px}.view-toggle button{padding:8px 13px;border-radius:10px;background:transparent;color:#64748b;font-size:.88rem}.view-toggle button.active{background:#fff;color:#2b4256;box-shadow:0 2px 7px rgba(60,80,100,.13)}
    .weekday-row,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.weekday{text-align:center;font-weight:800;color:#586575;padding:8px 0;font-size:.92rem}.weekday.sun{color:var(--sun)}.weekday.sat{color:var(--sat)}
    .day{min-height:132px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:9px;overflow:hidden;position:relative}.day.other{background:#f8fafc;color:#a0aaba}.day.today{outline:3px solid var(--yellow);outline-offset:-3px}
    .num{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:900;border-radius:10px;margin-bottom:6px;font-size:.95rem}.day.sun .num{color:var(--sun);background:#fff0f0}.day.sat .num{color:var(--sat);background:#eef4ff}
    .event{display:block;margin-top:5px;padding:7px 8px;border-radius:10px;color:#23313f;font-size:.8rem;line-height:1.3;font-weight:800;box-shadow:0 2px 5px rgba(0,0,0,.04);word-break:break-word}.event .time{display:block;font-size:.72rem;font-weight:700;opacity:.72;margin-bottom:2px}
    .inspect{background:#dff1ff;border-left:5px solid var(--blue)}.perform{background:#ffe5f0;border-left:5px solid var(--pink)}.recital{background:#eee7ff;border-left:5px solid var(--purple)}.welcome{background:#e2f7e9;border-left:5px solid var(--green)}.default{background:#fff1dc;border-left:5px solid var(--orange)}
    .list-view{display:none}.list-view.active{display:block}.calendar-view.hidden{display:none}
    .list-empty{padding:34px;text-align:center;color:var(--muted)}
    .list-item{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:stretch;margin:10px 0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(40,65,85,.05)}
    .list-date{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:13px 8px;background:#f8fafc}.list-date .md{font-size:1.12rem;font-weight:900}.list-date .wd{font-size:.78rem;color:var(--muted);margin-top:2px}.list-body{padding:13px 15px;border-left:6px solid var(--orange)}
    .list-item.inspect .list-body{border-left-color:var(--blue)}.list-item.perform .list-body{border-left-color:var(--pink)}.list-item.recital .list-body{border-left-color:var(--purple)}.list-item.welcome .list-body{border-left-color:var(--green)}
    .list-title{font-size:1rem;font-weight:900}.list-meta{margin-top:5px;color:var(--muted);font-size:.85rem;line-height:1.5}
    .legend{display:flex;flex-wrap:wrap;gap:9px 14px;margin-top:16px;color:#657384;font-size:.84rem}.legend span{display:flex;align-items:center;gap:6px}.swatch{width:12px;height:12px;border-radius:4px}
    footer{text-align:center;color:#8b97a6;font-size:.82rem;margin-top:18px}.loading{padding:48px;text-align:center;color:var(--muted)}
    @media(max-width:820px){body{overflow-x:hidden}.wrap{width:100%;padding:8px 6px 12px}.hero{padding:11px 13px;margin-bottom:8px;border-radius:16px;align-items:center}h1{font-size:clamp(1.25rem,6vw,1.65rem)}.subtitle{font-size:.72rem;margin-top:2px}.dots{gap:5px}.dot{width:8px;height:8px}.calendar-shell{width:100%;padding:8px 6px 9px;border-radius:16px;overflow:hidden}.toolbar{margin-bottom:5px;padding:0 2px}.month-title{font-size:1.08rem}.nav{gap:4px}.nav button{width:30px;height:30px;border-radius:9px;font-size:1rem}.view-toggle{gap:2px;padding:3px;border-radius:10px}.view-toggle button{padding:6px 8px;border-radius:8px;font-size:.7rem}.weekday-row,.grid{width:100%;min-width:0;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.weekday{padding:4px 0;font-size:.72rem}.day{min-width:0;min-height:clamp(61px,9.4dvh,76px);height:clamp(61px,9.4dvh,76px);border-radius:9px;padding:3px}.num{width:20px;height:20px;margin-bottom:1px;border-radius:6px;font-size:.72rem}.day.today{outline-width:2px;outline-offset:-2px}.event{margin-top:2px;padding:2px 2px 2px 4px;border-radius:5px;border-left-width:3px!important;font-size:clamp(.48rem,1.9vw,.62rem);line-height:1.1;max-height:3.45em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;box-shadow:none}.event .time{font-size:clamp(.44rem,1.65vw,.56rem);line-height:1.05;margin-bottom:1px}.legend{gap:3px 8px;margin-top:6px;font-size:.63rem;justify-content:center}.swatch{width:8px;height:8px;border-radius:2px}footer{font-size:.58rem;margin-top:5px}.loading{padding:24px 4px;font-size:.8rem}.list-item{grid-template-columns:72px 1fr;margin:7px 0;border-radius:12px}.list-date{padding:10px 5px}.list-date .md{font-size:.95rem}.list-date .wd{font-size:.68rem}.list-body{padding:10px 11px}.list-title{font-size:.9rem}.list-meta{font-size:.75rem}}
    @media(max-width:430px){.wrap{padding-left:4px;padding-right:4px}.hero{padding:9px 11px}.calendar-shell{padding-left:4px;padding-right:4px}.weekday-row,.grid{gap:2px}.day{min-height:clamp(56px,8.9dvh,70px);height:clamp(56px,8.9dvh,70px);padding:2px}.num{width:18px;height:18px;font-size:.68rem}.event{font-size:clamp(.44rem,1.8vw,.57rem);padding-left:3px}.event .time{font-size:clamp(.4rem,1.55vw,.52rem)}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero"><div><h1>竹小兒樂行事曆</h1><div class="subtitle">DCCB Calendar｜大竹國小兒童樂隊</div></div><div class="dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></section>
    <section class="calendar-shell">
      <div class="toolbar">
        <div class="left-tools"><div id="monthTitle" class="month-title">載入中...</div><div class="nav"><button id="prev" aria-label="上個月">‹</button><button id="next" aria-label="下個月">›</button></div></div>
        <div class="view-toggle"><button id="calendarBtn" class="active">▦ 月曆</button><button id="listBtn">☷ 條列</button></div>
      </div>
      <div id="calendarView" class="calendar-view">
        <div class="weekday-row"><div class="weekday sun">日</div><div class="weekday">一</div><div class="weekday">二</div><div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div><div class="weekday sat">六</div></div>
        <div id="calendar" class="grid"><div class="loading">行事資料載入中…</div></div>
      </div>
      <div id="listView" class="list-view"><div id="eventList"></div></div>
      <div class="legend"><span><i class="swatch" style="background:#62a9f4"></i>場勘</span><span><i class="swatch" style="background:#f47eb3"></i>表演</span><span><i class="swatch" style="background:#9d7bea"></i>發表會</span><span><i class="swatch" style="background:#6bcf8f"></i>迎新</span></div>
    </section>
    <footer>行事內容由竹小兒樂指揮日誌同步更新</footer>
  </main>
  <script>
    let events=[];let viewYear;let viewMonth;let mode=localStorage.getItem('dccb-view')||'calendar';
    const weekdays=['日','一','二','三','四','五','六'];
    function typeClass(title){if(title.includes('場勘'))return'inspect';if(title.includes('發表會'))return'recital';if(title.includes('迎新'))return'welcome';if(title.includes('表演'))return'perform';return'default'}
    function sameDate(y,m,d,str){const[yy,mm,dd]=str.split('-').map(Number);return yy===y&&mm===m+1&&dd===d}
    function switchMode(next){mode=next;localStorage.setItem('dccb-view',mode);document.getElementById('calendarBtn').classList.toggle('active',mode==='calendar');document.getElementById('listBtn').classList.toggle('active',mode==='list');document.getElementById('calendarView').classList.toggle('hidden',mode!=='calendar');document.getElementById('listView').classList.toggle('active',mode==='list');render()}
    function renderCalendar(){const grid=document.getElementById('calendar');const first=new Date(viewYear,viewMonth,1);const startDay=first.getDay();const daysInMonth=new Date(viewYear,viewMonth+1,0).getDate();const prevDays=new Date(viewYear,viewMonth,0).getDate();const today=new Date();let html='';for(let i=0;i<42;i++){let y=viewYear,m=viewMonth,d,other=false;if(i<startDay){d=prevDays-startDay+i+1;m=viewMonth-1;other=true;if(m<0){m=11;y--}}else if(i>=startDay+daysInMonth){d=i-(startDay+daysInMonth)+1;m=viewMonth+1;other=true;if(m>11){m=0;y++}}else d=i-startDay+1;const dow=new Date(y,m,d).getDay();const dayEvents=events.filter(e=>sameDate(y,m,d,e.date));const isToday=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;const cls=`day${other?' other':''}${dow===0?' sun':''}${dow===6?' sat':''}${isToday?' today':''}`;html+=`<div class="${cls}"><div class="num">${d}</div>`;html+=dayEvents.map(e=>`<div class="event ${typeClass(e.title)}">${e.time?`<span class="time">${e.time}</span>`:''}${e.title}${e.location?`<div class="time">${e.location}</div>`:''}</div>`).join('');html+='</div>'}grid.innerHTML=html}
    function renderList(){const box=document.getElementById('eventList');const monthEvents=events.filter(e=>{const[y,m]=e.date.split('-').map(Number);return y===viewYear&&m===viewMonth+1});if(!monthEvents.length){box.innerHTML='<div class="list-empty">這個月目前沒有行事</div>';return}box.innerHTML=monthEvents.map(e=>{const[y,m,d]=e.date.split('-').map(Number);const date=new Date(y,m-1,d);const cls=typeClass(e.title);return `<article class="list-item ${cls}"><div class="list-date"><div class="md">${m}/${d}</div><div class="wd">（${weekdays[date.getDay()]}）</div></div><div class="list-body"><div class="list-title">${e.title}</div><div class="list-meta">${e.time?`時間：${e.time}`:'全天'}${e.location?`<br>地點：${e.location}`:''}</div></div></article>`}).join('')}
    function render(){document.getElementById('monthTitle').textContent=`${viewYear}年 ${viewMonth+1}月`;if(mode==='calendar')renderCalendar();else renderList()}
    async function loadEvents(){try{const res=await fetch(`events.json?v=${Date.now()}`);events=await res.json();events.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));if(events.length){const[y,m]=events[0].date.split('-').map(Number);viewYear=y;viewMonth=m-1}else{const n=new Date();viewYear=n.getFullYear();viewMonth=n.getMonth()}switchMode(mode)}catch(e){document.getElementById('calendar').innerHTML='<div class="loading">行事資料載入失敗，請稍後再試。</div>';document.getElementById('eventList').innerHTML='<div class="list-empty">行事資料載入失敗，請稍後再試。</div>'}}
    document.getElementById('prev').onclick=()=>{viewMonth--;if(viewMonth<0){viewMonth=11;viewYear--}render()};document.getElementById('next').onclick=()=>{viewMonth++;if(viewMonth>11){viewMonth=0;viewYear++}render()};document.getElementById('calendarBtn').onclick=()=>switchMode('calendar');document.getElementById('listBtn').onclick=()=>switchMode('list');loadEvents();
  </script>
</body>
</html>
