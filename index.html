<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>竹小兒樂行事曆</title>
  <style>
    :root{
      --bg1:#fff7ed;
      --bg2:#eef8ff;
      --card:#ffffff;
      --text:#24303a;
      --muted:#718096;
      --line:#dfe7ef;
      --sun:#ff7b7b;
      --sat:#5b8def;
      --yellow:#ffd76a;
      --teal:#54c7b7;
      --orange:#ff9f68;
      --purple:#9d7bea;
      --pink:#f47eb3;
      --green:#6bcf8f;
      --blue:#62a9f4;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 12% 8%, #fff0b8 0 90px, transparent 91px),
        radial-gradient(circle at 88% 12%, #d8efff 0 110px, transparent 111px),
        linear-gradient(135deg,var(--bg1),var(--bg2));
    }
    .wrap{max-width:1180px;margin:0 auto;padding:28px 16px 48px}
    .hero{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:18px;
      padding:24px 26px;
      margin-bottom:18px;
      border-radius:26px;
      background:rgba(255,255,255,.9);
      border:1px solid rgba(255,255,255,.75);
      box-shadow:0 14px 40px rgba(71,91,112,.10);
      backdrop-filter:blur(8px);
    }
    h1{margin:0;font-size:clamp(1.7rem,4vw,2.6rem);letter-spacing:.04em}
    .subtitle{margin-top:6px;color:var(--muted);font-size:.96rem}
    .dots{display:flex;gap:8px;align-items:center}
    .dot{width:13px;height:13px;border-radius:50%}
    .dot:nth-child(1){background:var(--orange)}
    .dot:nth-child(2){background:var(--teal)}
    .dot:nth-child(3){background:var(--purple)}
    .dot:nth-child(4){background:var(--pink)}

    .calendar-shell{
      background:rgba(255,255,255,.94);
      border-radius:28px;
      padding:20px;
      box-shadow:0 16px 46px rgba(72,91,111,.12);
      border:1px solid rgba(255,255,255,.85);
    }
    .cal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }
    .month-title{font-size:1.45rem;font-weight:900;letter-spacing:.03em}
    .nav{display:flex;gap:8px}
    .nav button{
      border:0;
      background:#f3f7fb;
      color:#445160;
      width:38px;height:38px;
      border-radius:12px;
      font-size:1.1rem;
      cursor:pointer;
    }
    .nav button:hover{background:#eaf1f7}

    .weekday-row,.grid{
      display:grid;
      grid-template-columns:repeat(7,minmax(0,1fr));
      gap:8px;
    }
    .weekday{
      text-align:center;
      font-weight:800;
      color:#586575;
      padding:8px 0;
      font-size:.92rem;
    }
    .weekday.sun{color:var(--sun)}
    .weekday.sat{color:var(--sat)}

    .day{
      min-height:132px;
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      padding:9px;
      overflow:hidden;
      position:relative;
    }
    .day.other{background:#f8fafc;color:#a0aaba}
    .day.today{outline:3px solid #ffd76a;outline-offset:-3px}
    .num{
      width:30px;height:30px;
      display:flex;align-items:center;justify-content:center;
      font-weight:900;
      border-radius:10px;
      margin-bottom:6px;
      font-size:.95rem;
    }
    .day.sun .num{color:var(--sun);background:#fff0f0}
    .day.sat .num{color:var(--sat);background:#eef4ff}

    .event{
      display:block;
      margin-top:5px;
      padding:7px 8px;
      border-radius:10px;
      color:#23313f;
      font-size:.8rem;
      line-height:1.3;
      font-weight:800;
      box-shadow:0 2px 5px rgba(0,0,0,.04);
      word-break:break-word;
    }
    .event .time{display:block;font-size:.72rem;font-weight:700;opacity:.72;margin-bottom:2px}
    .event.inspect{background:#dff1ff;border-left:5px solid var(--blue)}
    .event.perform{background:#ffe5f0;border-left:5px solid var(--pink)}
    .event.recital{background:#eee7ff;border-left:5px solid var(--purple)}
    .event.welcome{background:#e2f7e9;border-left:5px solid var(--green)}
    .event.default{background:#fff1dc;border-left:5px solid var(--orange)}

    .legend{
      display:flex;flex-wrap:wrap;gap:9px 14px;
      margin-top:16px;
      color:#657384;
      font-size:.84rem;
    }
    .legend span{display:flex;align-items:center;gap:6px}
    .swatch{width:12px;height:12px;border-radius:4px}
    footer{text-align:center;color:#8b97a6;font-size:.82rem;margin-top:18px}
    .loading{padding:48px;text-align:center;color:var(--muted)}

    @media (max-width:820px){
      .wrap{padding:16px 8px 32px}
      .hero{padding:18px 18px;border-radius:20px}
      .calendar-shell{padding:12px;border-radius:20px;overflow-x:auto}
      .weekday-row,.grid{min-width:760px}
      .day{min-height:122px}
      .event{font-size:.76rem}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div>
        <h1>竹小兒樂行事曆</h1>
        <div class="subtitle">DCCB Calendar｜大竹國小兒童樂隊</div>
      </div>
      <div class="dots" aria-hidden="true">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </section>

    <section class="calendar-shell">
      <div class="cal-head">
        <div id="monthTitle" class="month-title">載入中...</div>
        <div class="nav">
          <button id="prev" aria-label="上個月">‹</button>
          <button id="next" aria-label="下個月">›</button>
        </div>
      </div>

      <div class="weekday-row">
        <div class="weekday sun">日</div><div class="weekday">一</div><div class="weekday">二</div>
        <div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div><div class="weekday sat">六</div>
      </div>
      <div id="calendar" class="grid"><div class="loading">行事資料載入中…</div></div>

      <div class="legend">
        <span><i class="swatch" style="background:#62a9f4"></i>場勘</span>
        <span><i class="swatch" style="background:#f47eb3"></i>表演</span>
        <span><i class="swatch" style="background:#9d7bea"></i>發表會</span>
        <span><i class="swatch" style="background:#6bcf8f"></i>迎新</span>
      </div>
    </section>

    <footer>行事內容由竹小兒樂指揮日誌同步更新</footer>
  </main>

  <script>
    let events = [];
    let viewYear;
    let viewMonth;

    function typeClass(title){
      if(title.includes('場勘')) return 'inspect';
      if(title.includes('發表會')) return 'recital';
      if(title.includes('迎新')) return 'welcome';
      if(title.includes('表演')) return 'perform';
      return 'default';
    }

    function sameDate(y,m,d,str){
      const [yy,mm,dd] = str.split('-').map(Number);
      return yy===y && mm===m+1 && dd===d;
    }

    function render(){
      const title = document.getElementById('monthTitle');
      const grid = document.getElementById('calendar');
      title.textContent = `${viewYear}年 ${viewMonth+1}月`;

      const first = new Date(viewYear,viewMonth,1);
      const startDay = first.getDay();
      const daysInMonth = new Date(viewYear,viewMonth+1,0).getDate();
      const prevDays = new Date(viewYear,viewMonth,0).getDate();
      const today = new Date();

      let html='';
      for(let i=0;i<42;i++){
        let y=viewYear,m=viewMonth,d,other=false;
        if(i<startDay){
          d = prevDays-startDay+i+1; m=viewMonth-1; other=true;
          if(m<0){m=11;y--}
        }else if(i>=startDay+daysInMonth){
          d = i-(startDay+daysInMonth)+1; m=viewMonth+1; other=true;
          if(m>11){m=0;y++}
        }else{
          d=i-startDay+1;
        }
        const dow = new Date(y,m,d).getDay();
        const dayEvents = events.filter(e=>sameDate(y,m,d,e.date));
        const isToday = today.getFullYear()===y && today.getMonth()===m && today.getDate()===d;
        const cls = `day${other?' other':''}${dow===0?' sun':''}${dow===6?' sat':''}${isToday?' today':''}`;
        html += `<div class="${cls}"><div class="num">${d}</div>`;
        html += dayEvents.map(e=>`<div class="event ${typeClass(e.title)}">${e.time?`<span class="time">${e.time}</span>`:''}${e.title}${e.location?`<div class="time">${e.location}</div>`:''}</div>`).join('');
        html += `</div>`;
      }
      grid.innerHTML=html;
    }

    async function loadEvents(){
      try{
        const res = await fetch(`events.json?v=${Date.now()}`);
        events = await res.json();
        events.sort((a,b)=>a.date.localeCompare(b.date));
        if(events.length){
          const [y,m] = events[0].date.split('-').map(Number);
          viewYear=y; viewMonth=m-1;
        }else{
          const n=new Date(); viewYear=n.getFullYear(); viewMonth=n.getMonth();
        }
        render();
      }catch(e){
        document.getElementById('calendar').innerHTML='<div class="loading">行事資料載入失敗，請稍後再試。</div>';
      }
    }

    document.getElementById('prev').onclick=()=>{viewMonth--;if(viewMonth<0){viewMonth=11;viewYear--}render()};
    document.getElementById('next').onclick=()=>{viewMonth++;if(viewMonth>11){viewMonth=0;viewYear++}render()};
    loadEvents();
  </script>
</body>
</html>
