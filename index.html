<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>竹小兒樂行事曆</title>
<style>
:root{--bg1:#fff7ed;--bg2:#eef8ff;--card:#fff;--text:#24303a;--muted:#718096;--line:#dfe7ef;--sun:#ff7b7b;--sat:#5b8def;--yellow:#ffd76a;--orange:#ff9f68;--purple:#9d7bea;--pink:#f47eb3;--green:#6bcf8f;--blue:#62a9f4}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--text);background:radial-gradient(circle at 12% 8%,#fff0b8 0 90px,transparent 91px),radial-gradient(circle at 88% 12%,#d8efff 0 110px,transparent 111px),linear-gradient(135deg,var(--bg1),var(--bg2))}.wrap{max-width:1180px;margin:auto;padding:28px 16px 48px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:24px 26px;margin-bottom:18px;border-radius:26px;background:rgba(255,255,255,.9);box-shadow:0 14px 40px rgba(71,91,112,.10)}h1{margin:0;font-size:clamp(1.7rem,4vw,2.6rem)}.subtitle{margin-top:6px;color:var(--muted);font-size:.96rem}.dots{display:flex;gap:8px}.dot{width:13px;height:13px;border-radius:50%}.dot:nth-child(1){background:var(--orange)}.dot:nth-child(2){background:#54c7b7}.dot:nth-child(3){background:var(--purple)}.dot:nth-child(4){background:var(--pink)}
.calendar-shell{background:rgba(255,255,255,.94);border-radius:28px;padding:20px;box-shadow:0 16px 46px rgba(72,91,111,.12)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}.left-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.month-title{font-size:1.45rem;font-weight:900}.nav,.view-toggle{display:flex;gap:8px}.nav button,.view-toggle button{border:0;cursor:pointer;font-weight:800}.nav button{background:#f3f7fb;color:#445160;width:38px;height:38px;border-radius:12px;font-size:1.1rem}.view-toggle{padding:4px;background:#f1f5f9;border-radius:14px}.view-toggle button{padding:8px 13px;border-radius:10px;background:transparent;color:#64748b}.view-toggle button.active{background:#fff;color:#2b4256;box-shadow:0 2px 7px rgba(60,80,100,.13)}
.weekday-row,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.weekday{text-align:center;font-weight:800;color:#586575;padding:8px 0;font-size:.92rem}.weekday.sun{color:var(--sun)}.weekday.sat{color:var(--sat)}.day{min-height:132px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:9px;overflow:hidden}.day.other{background:#f8fafc;color:#a0aaba}.day.today{outline:3px solid var(--yellow);outline-offset:-3px}.num{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:900;border-radius:10px;margin-bottom:6px}.day.sun .num{color:var(--sun);background:#fff0f0}.day.sat .num{color:var(--sat);background:#eef4ff}
.event{display:block;margin-top:5px;padding:7px 8px;border-radius:10px;color:#23313f;font-size:.8rem;line-height:1.3;font-weight:800;box-shadow:0 2px 5px rgba(0,0,0,.04);word-break:break-word;cursor:pointer;transition:.15s}.event:hover{transform:translateY(-1px);filter:brightness(.98)}.event .time{display:block;font-size:.72rem;font-weight:700;opacity:.72;margin-bottom:2px}.inspect{background:#dff1ff}.perform{background:#ffe5f0}.recital{background:#eee7ff}.welcome{background:#e2f7e9}.default{background:#fff1dc}
.list-view{display:none}.list-view.active{display:block}.calendar-view.hidden{display:none}.list-empty{padding:34px;text-align:center;color:var(--muted)}.list-item{display:grid;grid-template-columns:88px 1fr;gap:14px;margin:10px 0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(40,65,85,.05);cursor:pointer}.list-date{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:13px 8px;background:#f8fafc}.list-date .md{font-size:1.12rem;font-weight:900}.list-date .wd{font-size:.78rem;color:var(--muted)}.list-body{padding:13px 15px}.list-title{font-size:1rem;font-weight:900}.list-meta{margin-top:5px;color:var(--muted);font-size:.85rem;line-height:1.5}
.legend{display:flex;flex-wrap:wrap;gap:9px 14px;margin-top:16px;color:#657384;font-size:.84rem}.legend span{display:flex;align-items:center;gap:6px}.swatch{width:12px;height:12px;border-radius:4px}footer{text-align:center;color:#8b97a6;font-size:.82rem;margin-top:18px}
.modal-backdrop{position:fixed;inset:0;background:rgba(26,38,50,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:1000}.modal-backdrop.open{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:24px;box-shadow:0 24px 80px rgba(20,35,50,.28);overflow:hidden;animation:pop .16s ease-out}.modal-head{padding:22px 24px 14px;display:flex;justify-content:space-between;gap:12px}.modal-title{font-size:1.35rem;font-weight:900}.close{border:0;background:#f1f5f9;border-radius:50%;width:36px;height:36px;font-size:1.15rem;cursor:pointer;touch-action:manipulation}.modal-body{padding:0 24px 24px}.detail-row{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid #edf1f5}.detail-label{color:var(--muted);font-size:.86rem;font-weight:800}.detail-value{font-weight:700;white-space:pre-wrap}.description{margin-top:17px;padding:15px 16px;background:#f8fafc;border-radius:14px;line-height:1.65;white-space:pre-wrap}.hint{font-size:.78rem;color:#94a3b8;margin-top:12px}@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:scale(1);opacity:1}}
@media(max-width:820px){.wrap{padding:8px 6px 12px}.hero{padding:11px 13px;margin-bottom:8px;border-radius:16px}h1{font-size:1.45rem}.subtitle{font-size:.72rem}.dot{width:8px;height:8px}.calendar-shell{padding:8px 6px 9px;border-radius:16px}.month-title{font-size:1.08rem}.nav button{width:30px;height:30px}.view-toggle button{padding:6px 8px;font-size:.7rem}.weekday-row,.grid{gap:3px}.weekday{padding:4px 0;font-size:.72rem}.day{min-height:70px;height:70px;border-radius:9px;padding:3px}.num{width:20px;height:20px;font-size:.72rem;margin-bottom:1px}.event{margin-top:2px;padding:2px 4px;font-size:.56rem;line-height:1.1;max-height:3.4em;overflow:hidden;box-shadow:none}.event .time{font-size:.5rem}.legend{font-size:.63rem;justify-content:center}.list-item{grid-template-columns:72px 1fr;margin:7px 0}.list-date .md{font-size:.95rem}.list-title{font-size:.9rem}.list-meta{font-size:.75rem}.modal{border-radius:20px}.modal-head{padding:18px 18px 10px}.modal-body{padding:0 18px 20px}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero"><div><h1>竹小兒樂行事曆</h1><div class="subtitle">DCCB Calendar｜大竹國小兒童樂隊</div></div><div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></section>
<section class="calendar-shell">
<div class="toolbar"><div class="left-tools"><div id="monthTitle" class="month-title">載入中...</div><div class="nav"><button id="prev">‹</button><button id="next">›</button></div></div><div class="view-toggle"><button id="calendarBtn" class="active">▦ 月曆</button><button id="listBtn">☷ 條列</button></div></div>
<div id="calendarView" class="calendar-view"><div class="weekday-row"><div class="weekday sun">日</div><div class="weekday">一</div><div class="weekday">二</div><div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div><div class="weekday sat">六</div></div><div id="calendar" class="grid"></div></div>
<div id="listView" class="list-view"><div id="eventList"></div></div>
<div class="legend"><span><i class="swatch" style="background:#62a9f4"></i>場勘</span><span><i class="swatch" style="background:#f47eb3"></i>表演</span><span><i class="swatch" style="background:#9d7bea"></i>發表會</span><span><i class="swatch" style="background:#6bcf8f"></i>迎新</span></div>
</section><footer>行事內容由竹小兒樂指揮日誌同步更新</footer></main>
<div id="modalBackdrop" class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div id="modalTitle" class="modal-title"></div><button id="closeModalButton" class="close" type="button" aria-label="關閉">×</button></div><div class="modal-body"><div class="detail-row"><div class="detail-label">日期</div><div id="modalDate" class="detail-value"></div></div><div class="detail-row"><div class="detail-label">時間</div><div id="modalTime" class="detail-value"></div></div><div class="detail-row"><div class="detail-label">地點</div><div id="modalLocation" class="detail-value"></div></div><div id="modalDescription" class="description"></div><div class="hint">點選視窗外或右上角 × 可關閉</div></div></div></div>
<script>
let events=[],viewYear,viewMonth,mode=localStorage.getItem('dccb-view')||'calendar';const weekdays=['日','一','二','三','四','五','六'];
const monthTitleEl=document.getElementById('monthTitle'),prevBtn=document.getElementById('prev'),nextBtn=document.getElementById('next'),calendarBtn=document.getElementById('calendarBtn'),listBtn=document.getElementById('listBtn'),calendarView=document.getElementById('calendarView'),listView=document.getElementById('listView'),calendarEl=document.getElementById('calendar'),modalBackdrop=document.getElementById('modalBackdrop'),closeModalButton=document.getElementById('closeModalButton');
function typeClass(t){if(t.includes('場勘'))return'inspect';if(t.includes('發表會'))return'recital';if(t.includes('迎新'))return'welcome';if(t.includes('表演'))return'perform';return'default'}
function sameDate(y,m,d,s){const[yy,mm,dd]=s.split('-').map(Number);return yy===y&&mm===m+1&&dd===d}
function openEvent(i){const e=events[i];if(!e)return;const[y,m,d]=e.date.split('-').map(Number),dt=new Date(y,m-1,d);document.getElementById('modalTitle').textContent=e.title;document.getElementById('modalDate').textContent=`${y}/${m}/${d}（${weekdays[dt.getDay()]}）`;document.getElementById('modalTime').textContent=e.time||'全天';document.getElementById('modalLocation').textContent=e.location||'未設定';document.getElementById('modalDescription').textContent=e.description||'尚未新增行事說明。';modalBackdrop.classList.add('open')}
function hideModal(){modalBackdrop.classList.remove('open')}
function switchMode(n){mode=n;localStorage.setItem('dccb-view',mode);calendarBtn.classList.toggle('active',mode==='calendar');listBtn.classList.toggle('active',mode==='list');calendarView.classList.toggle('hidden',mode!=='calendar');listView.classList.toggle('active',mode==='list');render()}
function renderCalendar(){const g=calendarEl,first=new Date(viewYear,viewMonth,1),sd=first.getDay(),dim=new Date(viewYear,viewMonth+1,0).getDate(),pd=new Date(viewYear,viewMonth,0).getDate(),today=new Date();let h='';for(let i=0;i<42;i++){let y=viewYear,m=viewMonth,d,o=false;if(i<sd){d=pd-sd+i+1;m--;o=true;if(m<0){m=11;y--}}else if(i>=sd+dim){d=i-(sd+dim)+1;m++;o=true;if(m>11){m=0;y++}}else d=i-sd+1;const dow=new Date(y,m,d).getDay(),isToday=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d,dayEvents=events.map((e,idx)=>({e,idx})).filter(x=>sameDate(y,m,d,x.e.date));h+=`<div class="day${o?' other':''}${dow===0?' sun':''}${dow===6?' sat':''}${isToday?' today':''}"><div class="num">${d}</div>`;h+=dayEvents.map(x=>`<div class="event ${typeClass(x.e.title)}" onclick="openEvent(${x.idx})">${x.e.title}</div>`).join('');h+='</div>'}g.innerHTML=h}
function renderList(){const b=document.getElementById('eventList'),monthEvents=events.map((e,idx)=>({e,idx})).filter(x=>{const[y,m]=x.e.date.split('-').map(Number);return y===viewYear&&m===viewMonth+1});if(!monthEvents.length){b.innerHTML='<div class="list-empty">這個月目前沒有行事</div>';return}b.innerHTML=monthEvents.map(x=>{const e=x.e,[y,m,d]=e.date.split('-').map(Number),dt=new Date(y,m-1,d),c=typeClass(e.title);return`<article class="list-item ${c}" onclick="openEvent(${x.idx})"><div class="list-date"><div class="md">${m}/${d}</div><div class="wd">（${weekdays[dt.getDay()]}）</div></div><div class="list-body"><div class="list-title">${e.title}</div><div class="list-meta">${e.time?`時間：${e.time}`:'全天'}${e.location?`<br>地點：${e.location}`:''}</div></div></article>`}).join('')}
function render(){monthTitleEl.textContent=`${viewYear}年 ${viewMonth+1}月`;mode==='calendar'?renderCalendar():renderList()}
async function loadEvents(){try{const r=await fetch(`events.json?v=${Date.now()}`);events=await r.json();events.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));const n=new Date();viewYear=n.getFullYear();viewMonth=n.getMonth();switchMode(mode)}catch(e){calendarEl.innerHTML='<div class="list-empty">行事資料載入失敗</div>'}}
prevBtn.addEventListener('click',()=>{if(--viewMonth<0){viewMonth=11;viewYear--}render()});
nextBtn.addEventListener('click',()=>{if(++viewMonth>11){viewMonth=0;viewYear++}render()});
calendarBtn.addEventListener('click',()=>switchMode('calendar'));
listBtn.addEventListener('click',()=>switchMode('list'));
closeModalButton.addEventListener('click',hideModal);
closeModalButton.addEventListener('touchend',e=>{e.preventDefault();hideModal()},{passive:false});
modalBackdrop.addEventListener('click',e=>{if(e.target===modalBackdrop)hideModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideModal()});
loadEvents();
</script>
</body></html>
