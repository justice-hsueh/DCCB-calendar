<section class="calendar-shell">
<div class="toolbar"><div class="left-tools"><div id="monthTitle" class="month-title">載入中...</div><div class="nav"><button id="prev">‹</button><button id="next">›</button></div></div><div class="view-toggle"><button id="calendarBtn" class="active">▦ 月曆</button><button id="listBtn">☷ 條列</button></div></div>
<div id="calendarView" class="calendar-view"><div class="weekday-row"><div class="weekday sun">日</div><div class="weekday">一</div><div class="weekday">二</div><div class="weekday">三</div><div class="weekday">四</div><div class="weekday">五</div><div class="weekday sat">六</div></div><div id="calendar" class="grid"></div></div>
<div id="listView" class="list-view"><div id="eventList"></div></div>
<div class="legend"><span><i class="swatch" style="background:#62a9f4"></i>場勘</span><span><i class="swatch" style="background:#f47eb3"></i>表演</span><span><i class="swatch" style="background:#9d7bea"></i>發表會</span><span><i class="swatch" style="background:#6bcf8f"></i>迎新</span></div>
</section><footer>行事內容由竹小兒樂指揮日誌同步更新</footer></main>
<div id="modalBackdrop" class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><div id="modalTitle" class="modal-title"></div><button id="closeModalButton" class="close" type="button">×</button></div><div class="modal-body"><div id="detailRows"><div class="detail-row"><div class="detail-label">日期</div><div id="modalDate" class="detail-value"></div></div><div class="detail-row"><div class="detail-label">時間</div><div id="modalTime" class="detail-value"></div></div><div class="detail-row"><div class="detail-label">地點</div><div id="modalLocation" class="detail-value"></div></div><div id="modalDescription" class="description"></div></div><div id="dayList" class="day-list" style="display:none"></div><div class="hint">點選視窗外或右上角 × 可關閉</div></div></div></div>
<script>
let events=[],viewYear,viewMonth,mode=localStorage.getItem('dccb-view')||'calendar';const weekdays=['日','一','二','三','四','五','六'];
const monthTitleEl=document.getElementById('monthTitle'),prevBtn=document.getElementById('prev'),nextBtn=document.getElementById('next'),calendarBtn=document.getElementById('calendarBtn'),listBtn=document.getElementById('listBtn'),calendarView=document.getElementById('calendarView'),listView=document.getElementById('listView'),calendarEl=document.getElementById('calendar'),modalBackdrop=document.getElementById('modalBackdrop'),closeModalButton=document.getElementById('closeModalButton'),detailRows=document.getElementById('detailRows'),dayList=document.getElementById('dayList');
function typeClass(t){if(t.includes('場勘'))return'inspect';if(t.includes('發表會'))return'recital';if(t.includes('迎新'))return'welcome';if(t.includes('表演'))return'perform';return'default'}
function sameDate(y,m,d,s){const[yy,mm,dd]=s.split('-').map(Number);return yy===y&&mm===m+1&&dd===d}
function isPastDate(s){const[y,m,d]=s.split('-').map(Number),dt=new Date(y,m-1,d),today=new Date();today.setHours(0,0,0,0);dt.setHours(0,0,0,0);return dt<today}
function openEvent(i){const e=events[i];if(!e)return;detailRows.style.display='block';dayList.style.display='none';const[y,m,d]=e.date.split('-').map(Number),dt=new Date(y,m-1,d);document.getElementById('modalTitle').textContent=e.title;document.getElementById('modalDate').textContent=`${y}/${m}/${d}（${weekdays[dt.getDay()]}）`;document.getElementById('modalTime').textContent=e.time||'全天';document.getElementById('modalLocation').textContent=e.location||'未設定';document.getElementById('modalDescription').textContent=e.description||'尚未新增行事說明。';modalBackdrop.classList.add('open')}
function openDayEvents(y,m,d){const items=events.map((e,idx)=>({e,idx})).filter(x=>sameDate(y,m,d,x.e.date));detailRows.style.display='none';dayList.style.display='grid';document.getElementById('modalTitle').textContent=`${m+1}/${d} 全部行事`;dayList.innerHTML=items.map(x=>`<button class="${typeClass(x.e.title)}${isPastDate(x.e.date)?' past-event':''}" onclick="openEvent(${x.idx})">${x.e.time?x.e.time+'　':''}${x.e.title}</button>`).join('');modalBackdrop.classList.add('open')}
function hideModal(){modalBackdrop.classList.remove('open')}
function switchMode(n){mode=n;localStorage.setItem('dccb-view',mode);calendarBtn.classList.toggle('active',mode==='calendar');listBtn.classList.toggle('active',mode==='list');calendarView.classList.toggle('hidden',mode!=='calendar');listView.classList.toggle('active',mode==='list');render()}
function renderCalendar(){const first=new Date(viewYear,viewMonth,1),sd=first.getDay(),dim=new Date(viewYear,viewMonth+1,0).getDate(),totalCells=Math.ceil((sd+dim)/7)*7,today=new Date();today.setHours(0,0,0,0);let h='';for(let i=0;i<totalCells;i++){if(i<sd||i>=sd+dim){h+='<div class="day other"></div>';continue}const y=viewYear,m=viewMonth,d=i-sd+1,cellDate=new Date(y,m,d);cellDate.setHours(0,0,0,0);const dow=cellDate.getDay(),isToday=cellDate.getTime()===today.getTime(),isPast=cellDate<today,dayEvents=events.map((e,idx)=>({e,idx})).filter(x=>sameDate(y,m,d,x.e.date)),shown=dayEvents.slice(0,3),extra=dayEvents.length-3;h+=`<div class="day${isPast?' past':''}${dow===0?' sun':''}${dow===6?' sat':''}${isToday?' today':''}"><div class="num">${d}</div>`;h+=shown.map(x=>`<div class="event ${typeClass(x.e.title)}${isPast?' past-event':''}" onclick="openEvent(${x.idx})">${x.e.title}</div>`).join('');if(extra>0)h+=`<div class="more-events" onclick="openDayEvents(${y},${m},${d})">＋${extra} 件</div>`;h+='</div>'}calendarEl.innerHTML=h}
function renderList(){const b=document.getElementById('eventList'),monthEvents=events.map((e,idx)=>({e,idx})).filter(x=>{const[y,m]=x.e.date.split('-').map(Number);return y===viewYear&&m===viewMonth+1&&!isPastDate(x.e.date)});if(!monthEvents.length){b.innerHTML='<div class="list-empty">這個月目前沒有尚未發生的行事</div>';return}b.innerHTML=monthEvents.map(x=>{const e=x.e,[y,m,d]=e.date.split('-').map(Number),dt=new Date(y,m-1,d),c=typeClass(e.title);return`<article class="list-item ${c}" onclick="openEvent(${x.idx})"><div class="list-date"><div class="md">${m}/${d}</div><div class="wd">（${weekdays[dt.getDay()]}）</div></div><div class="list-body"><div class="list-title">${e.title}</div><div class="list-meta">${e.time?`時間：${e.time}`:'全天'}${e.location?`<br>地點：${e.location}`:''}</div></div></article>`}).join('')}
function render(){monthTitleEl.textContent=`${viewYear}年 ${viewMonth+1}月`;mode==='calendar'?renderCalendar():renderList()}
async function loadEvents(){try{const r=await fetch(`events.json?v=${Date.now()}`);events=await r.json();events.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));const n=new Date();viewYear=n.getFullYear();viewMonth=n.getMonth();switchMode(mode)}catch(e){calendarEl.innerHTML='<div class="list-empty">行事資料載入失敗</div>'}}
prevBtn.addEventListener('click',()=>{if(--viewMonth<0){viewMonth=11;viewYear--}render()});nextBtn.addEventListener('click',()=>{if(++viewMonth>11){viewMonth=0;viewYear++}render()});calendarBtn.addEventListener('click',()=>switchMode('calendar'));listBtn.addEventListener('click',()=>switchMode('list'));closeModalButton.addEventListener('click',hideModal);modalBackdrop.addEventListener('click',e=>{if(e.target===modalBackdrop)hideModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hideModal()});loadEvents();
</script>
